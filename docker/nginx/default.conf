# Reverse proxy for every tenant hostname.
# The Host header MUST be forwarded unchanged: django-tenants picks the tenant
# (and therefore the database schema) from it.
upstream django {
    server web:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    # Catch-all: the public domain and every tenant (sub)domain or custom domain.
    server_name _;

    client_max_body_size 25m;

    # Media is stored per tenant under /<schema>/..., written by Django.
    # For private files use X-Accel-Redirect or signed S3 URLs instead.
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS usually terminates at a load balancer in front of nginx; pass its
        # scheme through, or set "https" here if nginx terminates TLS itself.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
