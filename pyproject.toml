[project]
name = "django-multi-tenant"
version = "0.1.0"
description = "Production-ready Django multi-tenant boilerplate: schema-per-tenant PostgreSQL (django-tenants), uv, Docker Compose, Celery, read replicas and multi-database routing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "django>=6.1,<6.2",
    "django-tenants>=4.0.7,<5",
    "djangorestframework>=3.18,<4",
    "drf-spectacular>=0.30,<1",
    "django-environ>=0.14,<1",
    "psycopg[binary,pool]>=3.3.9,<4",
    "redis>=6,<9",
    "celery[redis]>=5.7,<6",
    "tenant-schemas-celery>=5.0,<6",
    "gunicorn>=23",
    "uvicorn[standard]>=0.54.0",
    "whitenoise>=6.12,<7",
    "django-cors-headers>=4.7",
]

[project.optional-dependencies]
s3 = ["django-storages[s3]>=1.14.6"]
sentry = ["sentry-sdk[django]>=2.75.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.15",
    "pre-commit>=4.0",
    "django-debug-toolbar>=6.0",
    "ipython>=9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "C4", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"config/settings/*" = ["F405", "F403", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]
addopts = "-ra --strict-markers"
testpaths = ["apps"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["**/migrations/*", "**/tests/*"]
