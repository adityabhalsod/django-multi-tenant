<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Django Multi-Tenant{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --accent: #0c7a5b; }
    body { font: 16px/1.6 system-ui, sans-serif; max-width: 46rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .25rem; } code { background: #8882; padding: .1rem .3rem; border-radius: 4px; }
    a { color: var(--accent); } .muted { opacity: .7; } ul { padding-left: 1.2rem; }
  </style>
</head>
<body>{% block content %}{% endblock %}</body>
</html>
